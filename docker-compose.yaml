version: "3.9"
services:
  redis:
    image: docker.io/library/redis:7-alpine
    restart: unless-stopped
    network_mode: host
    command: redis-server --save "" --appendonly no --port 6379

  scraper:
    build:
      context: .
      dockerfile: docker/Dockerfile.scraper
    restart: unless-stopped
    network_mode: host
    env_file: [.env]
    environment:
      - REDIS_HOST=127.0.0.1
      - DB_PATH=/data/makeaibilli.db
    volumes:
      - ./data:/data

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    restart: unless-stopped
    network_mode: host
    env_file: [.env]
    environment:
      - REDIS_HOST=127.0.0.1
      - DB_PATH=/data/makeaibilli.db
    volumes:
      - ./data:/data
