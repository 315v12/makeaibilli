name: Secret scan
on: [push, pull_request]
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for committed secrets
        run: |
          if git ls-files | grep -qE '^\.env$'; then
            echo "::error::.env is tracked — never commit this"
            exit 1
          fi
          if git grep -inE "(api[_-]?key|token|secret)[[:space:]]*=[[:space:]]*['\"][a-zA-Z0-9]{20,}" -- ':!*.template' ':!*.md'; then
            echo "::error::possible hardcoded secret detected"
            exit 1
          fi
          echo "clean"
